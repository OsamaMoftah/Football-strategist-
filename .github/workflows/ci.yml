name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9.15.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements-server.txt
      - run: pip install -r pipeline/requirements-server.txt
      - run: PYTHONPATH=. pytest pipeline/tests -q
  container:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t football-strategist .
      - run: docker run -d --name strategist -p 7860:7860 football-strategist
      - name: Check container and bundled model
        run: |
          curl --fail --silent --output /dev/null --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:7860/
          curl --fail --silent --head --output /dev/null http://127.0.0.1:7860/models/football-ball/model.onnx
          curl --fail --silent --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:7860/api/native/health
          docker exec strategist python pipeline/service/smoke.py
      - if: always()
        run: docker logs strategist
